services:
  db:
    image: postgres:16-alpine
    container_name: horses-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: horses
      POSTGRES_PASSWORD: horses
      POSTGRES_DB: horses
    ports:
      - "5432:5432"
    volumes:
      - horses-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horses -d horses"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  horses-db-data:
